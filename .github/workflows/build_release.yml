name: build_release
env:
  # 全局开启Action底层Node24，消除原Node20弃用提醒
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # 关闭punycode废弃警告
  NODE_OPTIONS: "--no-deprecation"

on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:

jobs:
  check_changes:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: changes
        run: |
          prev_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "none")
          if [ "$prev_tag" == "none" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            if git diff --exit-code $prev_tag HEAD -- src; then
              echo "No changes detected in 'src' directory between $prev_tag and the latest commit."
              echo "changed=false" >> $GITHUB_OUTPUT
            else
              echo "changed=true" >> $GITHUB_OUTPUT
            fi
          fi

  build_release:
    needs: check_changes
    if: ${{ needs.check_changes.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      changes_detected: ${{ needs.check_changes.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install

      - name: Temp build folder avoid scan bug
        shell: bash
        run: |
          shopt -s extglob
          mkdir build_tmp
          cp -r !(build_tmp) build_tmp/
          cd build_tmp
          # 1.安装依赖（package.json存在）
          pnpm install
          pnpm add -D @types/node
          # 2.安装完改名package.json，GKD不会读到
          mv package.json package.json.bak
          # 不走pnpm run build，直接node+tsx启动构建，不再依赖pnpm读取package.json脚本
          npx tsx ./scripts/build.ts
          # 复原配置
          mv package.json.bak package.json
          cp -r dist ../
          cd ..
          rm -rf build_tmp

      - id: version
        run: |
          version=$(node -e "import('@gkd-kit/tools').then((m) => m.stdoutGkdVersion());")
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Git commit
        id: commit
        run: |
          git config --local user.email github-actions[bot]@users.noreply.github.com
          git config --local user.name github-actions[bot]
          git status
          git add .
          git commit -a -m "chore: v${{steps.version.outputs.version}}"
        continue-on-error: true

      - name: Git push
        if: ${{ steps.commit.outcome == 'success' }}
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}
          tags: true

      - name: Create Release
        id: create_release
        if: ${{ steps.commit.outcome == 'success' }}
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.version.outputs.version }}
          release_name: Release ${{ steps.version.outputs.version }}
          body_path: ./dist/CHANGELOG.md

      - name: Publish package
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        if: ${{ steps.commit.outcome == 'success' && env.NPM_TOKEN != '' }}
        run: |
          pnpm config set //registry.npmjs.org/:_authToken ${{ secrets.NPM_TOKEN }}
          node -e "import('@gkd-kit/tools').then((m) => m.updatePkgVersion());"
          pnpm publish --no-git-checks
          node -e "import('@gkd-kit/tools').then((m) => m.syncNpmmirror());"